<!doctype html>
<html>
    <head>
        <title>Simple Product CRUD</title>

        <style>
            body {
                font-family: Arial;
                margin: 40px;
            }

            table {
                border-collapse: collapse;
                width: 50%;
            }

            th,
            td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
            }

            th {
                background: #eee;
            }

            form {
                margin-bottom: 20px;
            }

            input {
                padding: 10px;
                font-size: 16px;
            }

            button {
                padding: 10px 15px;
                font-size: 16px;
                cursor: pointer;
            }

            .actions button {
                margin-right: 8px;
            }
        </style>
    </head>

    <body>
        <h2>Product List</h2>
        <p id="dataSource" role="status"></p>

        <form id="productForm">
            <input type="hidden" id="productId" />

            <input type="text" id="name" placeholder="Product Name" required />

            <input
                type="number"
                id="price"
                step="0.01"
                placeholder="Price"
                required
            />

            <button type="submit" id="submitButton">Add Product</button>

            <button type="button" id="cancelButton" style="display: none">
                Cancel
            </button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productTable"></tbody>
        </table>

        <script src="config.js"></script>
        <script src="main.js"></script>
    </body>
</html>
